[package]
name = "snake-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "snake_core"
path = "src/lib.rs"

[dependencies]
# 关闭默认特性（含 std_rng -> getrandom），否则 wasm 目标编译失败；
# 仅开启 small_rng + std 即可满足 SmallRng/SeedableRng/gen_range。
rand = { version = "0.8", default-features = false, features = ["small_rng", "std"] }
